<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tính lãi tiền vay</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302b;--mute:#5c726d;--line:#cfdcd8;--accent:#0b6b5c;--onaccent:#fff;--err:#b3261e;--res:#e2f0ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#162623;--ink:#e6f1ee;--mute:#93aca6;--line:#2b403c;--accent:#4fc3ac;--onaccent:#06241f;--err:#ff8a80;--res:#1c3330}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#162623;--ink:#e6f1ee;--mute:#93aca6;--line:#2b403c;--accent:#4fc3ac;--onaccent:#06241f;--err:#ff8a80;--res:#1c3330}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:8px 0 4px;font-weight:700}
p.sub{margin:0 0 18px;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:500;font-size:14px;margin:0 0 6px}
.f{margin-bottom:14px}
input{width:100%;min-width:0;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:52px;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left;min-height:1.5em}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:.7}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
#err{color:var(--err);font-size:14px;min-height:20px;margin:0 0 4px}
button{width:100%;font:inherit;font-weight:700;background:var(--accent);color:var(--onaccent);border:0;border-radius:10px;padding:13px;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);font-weight:500;margin-top:8px;border:1px solid var(--line)}
#out{margin-top:16px;display:none}
.big{background:var(--res);border-radius:14px;padding:18px 16px;margin-bottom:12px}
.big small{display:block;color:var(--mute);font-size:14px}
.big strong{display:block;font-size:34px;line-height:1.2;font-weight:700;color:var(--accent);word-break:break-word}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}
dt{color:var(--mute);font-size:14px}dd{margin:0;font-weight:500;text-align:right}
.note{font-size:13px;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Tính lãi tiền vay</h1>
<p class="sub">Lãi suất tính theo tháng chuẩn 30 ngày.</p>
<div class="card">
<div class="f"><label for="d1">Ngày vay</label><input id="d1" type="date"></div>
<div class="f"><label for="d2">Ngày trả</label><input id="d2" type="date"></div>
<div class="f"><label for="amt">Số tiền vay (đồng)</label><input id="amt" inputmode="numeric" placeholder="50.000.000" autocomplete="off"></div>
<div class="f"><label for="rate">Lãi suất mỗi tháng (%)</label><input id="rate" inputmode="decimal" placeholder="2" autocomplete="off"></div>
<p id="err" role="alert"></p>
<button id="go" type="button">Tính tiền lãi</button>
<button id="reset" class="ghost" type="button">Nhập lại</button>
</div>
<div id="out" aria-live="polite">
<div class="big"><small>Tiền lãi</small><strong id="r-int"></strong></div>
<div class="card"><dl>
<div><dt>Số ngày vay</dt><dd id="r-days"></dd></div>
<div><dt>Lãi mỗi ngày</dt><dd id="r-day"></dd></div>
<div><dt>Tiền gốc</dt><dd id="r-p"></dd></div>
<div><dt>Gốc + lãi</dt><dd id="r-tot"></dd></div>
</dl></div>
<p class="note">Công thức: tiền vay × lãi suất tháng ÷ 30 × số ngày. Số ngày = ngày trả − ngày vay.</p>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const vnd=n=>Math.round(n).toLocaleString("vi-VN")+" đ";
$("amt").addEventListener("input",e=>{const d=e.target.value.replace(/\D/g,"");e.target.value=d?Number(d).toLocaleString("vi-VN"):""});
function utc(s){const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}
function calc(){
  const err=$("err");err.textContent="";$("out").style.display="none";
  const a=$("d1").value,b=$("d2").value;
  const P=Number($("amt").value.replace(/\D/g,""));
  const r=parseFloat($("rate").value.replace(",","."));
  if(!a||!b){err.textContent="Hãy chọn ngày vay và ngày trả.";return}
  if(!P){err.textContent="Hãy nhập số tiền vay.";return}
  if(isNaN(r)||r<0){err.textContent="Hãy nhập lãi suất mỗi tháng, ví dụ 2 hoặc 1,5.";return}
  const days=Math.round((utc(b)-utc(a))/86400000);
  if(days<0){err.textContent="Ngày trả phải sau ngày vay.";return}
  const perDay=P*(r/100)/30, interest=perDay*days;
  $("r-int").textContent=vnd(interest);
  $("r-days").textContent=days.toLocaleString("vi-VN")+" ngày";
  $("r-day").textContent=vnd(perDay);
  $("r-p").textContent=vnd(P);
  $("r-tot").textContent=vnd(P+interest);
  $("out").style.display="block";
  $("out").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("go").addEventListener("click",calc);
$("reset").addEventListener("click",()=>{["d1","d2","amt","rate"].forEach(i=>$(i).value="");$("err").textContent="";$("out").style.display="none"});
</script>
</body>
</html>
